# FreyaTTS SFT stage 1 (voice lock): full-parameter fine-tuning of a pretraining
# checkpoint on the target speaker's corpus.
# usage: accelerate launch training/sft.py --config training/configs/sft_stage1.yaml

init: checkpoints/pretrain/final/model.pt
data: data/latents_sft
vocab_json: freyatts/char_vocab.json
out: checkpoints/sft_stage1

d_model: 768
depth: 22
heads: 12
ff: 2048

steps: 3000  # short stage; our released checkpoints were selected around step 1000
batch_size: 64
grad_accum: 1
lr: 1.0e-4
warmup: 2000
lambda_dur: 0.1

max_frames: 500
num_workers: 3

save_every: 10000
log_every: 50
seed: 0
