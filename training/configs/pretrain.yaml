# FreyaTTS from-scratch pretraining
# usage: accelerate launch training/pretrain.py --config training/configs/pretrain.yaml

data: data/latents
vocab_json: freyatts/char_vocab.json
out: checkpoints/pretrain

# model (183M)
d_model: 768
depth: 22
heads: 12
ff: 2048

# optimization
steps: 150000
batch_size: 64
grad_accum: 1
lr: 5.0e-4            # AdamW, betas (0.9, 0.95), weight decay 0.01, grad clip 1.0
warmup: 2000          # linear warmup, then cosine decay to 5% of peak
lambda_dur: 0.1

# data limits
max_frames: 500       # 20 s at 25 Hz
num_workers: 3

save_every: 10000
log_every: 50
seed: 0
