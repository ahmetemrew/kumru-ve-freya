<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freya Voice Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="logo-container">
                <i class="fa-solid fa-robot"></i>
                <h1>Freya Voice AI</h1>
            </div>
            <p>Akıllı Sesli Asistan</p>
        </header>

        <main>
            <div class="chat-container glass-card">
                <div class="chat-history" id="chat-history">
                    <div class="message system">
                        <div class="avatar"><i class="fa-solid fa-server"></i></div>
                        <div class="bubble">Merhaba! Ben sesli asistanın. Mikrofona tıklayarak benimle konuşabilirsin.</div>
                    </div>
                </div>
                
                <div class="controls-area">
                    <button id="mic-btn" class="mic-btn">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <div id="status-text" class="status-text">Dinlemek için mikrofona bas...</div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Powered by Kumru AI</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
